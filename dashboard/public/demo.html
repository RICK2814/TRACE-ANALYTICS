<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trail Co. Home</title>
<style>
  body { margin:0; font-family: system-ui, sans-serif; color:#1d2b24; background:#f4f7f3; }
  header { padding:20px 40px; background:#1d3b2f; color:#fff; display:flex; justify-content:space-between; align-items:center; }
  nav a { color:#cfe6d8; margin-left:20px; text-decoration:none; }
  nav button { color:#cfe6d8; margin-left:20px; background:transparent; border:0; padding:0; font:inherit; cursor:pointer; }
  nav button:hover { color:#fff; }
  nav button:disabled { opacity:.7; cursor:wait; }
  nav button[hidden] { display:none; }
  .hero { padding:80px 40px; max-width:900px; margin:auto; }
  .hero h1 { font-size:44px; margin:0 0 12px; }
  button, .btn { background:#e07a2f; color:#fff; border:0; padding:14px 26px; border-radius:6px; font-size:16px; cursor:pointer; text-decoration:none; display:inline-block; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:900px; margin:0 auto; padding:0 40px; }
  .card { background:#fff; padding:24px; border-radius:8px; height:140px; }
  section { max-width:900px; margin:60px auto; padding:0 40px; }
  footer { background:#1d3b2f; color:#cfe6d8; padding:60px 40px; margin-top:600px; }
</style>
</head>
<body>
<header><strong>Trail Co.</strong><nav><a href="#">Shop</a><a href="#">Guides</a><a href="#">Contact</a><button id="trace-signout" type="button" hidden>Sign out</button></nav></header>
<div class="hero">
  <h1>Trail Co. Home</h1>
  <p>Click around and scroll. Every click is recorded for the dashboard.</p>
  <button>Start shopping</button> <a class="btn" style="background:#2f6f55" href="demo2.html">See the gear list</a>
</div>
<div class="grid"><div class="card">Tents</div><div class="card">Boots</div><div class="card">Packs</div></div>
<section><h2>Why us</h2><p>Lightweight gear tested on real trails.</p><button>Read reviews</button></section>
<footer>Subscribe: <button>Join newsletter</button></footer>
<script src="/tracker.js" data-api="/api/events"></script>
 <script src="/session-ui.js"></script>
</body>
</html>
